name: rimapay
description: A modern mobile wallet and bill-pay app inspired by Chipper Cash, Kuda Bank, and Opay.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9
  
  # Navigation
  go_router: ^16.2.1
  
  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  flutter_animate: ^4.3.0
  
  # Storage & Persistence
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  
  # Authentication & Security
  local_auth: ^2.1.7
  crypto: ^3.0.3
  
  # HTTP & API
  dio: ^5.3.3
  retrofit: ^4.0.3
  json_annotation: ^4.8.1
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.2.1
  equatable: ^2.0.5
  
  # Device Features
  permission_handler: ^12.0.1
  device_info_plus: ^11.5.0
  package_info_plus: ^8.3.1
  
  # Animation & Graphics
  lottie: ^3.3.1
  shimmer: ^3.0.0
  
  # Forms & Validation
  flutter_form_builder: ^10.1.0
  form_builder_validators: ^11.2.0
  
  # Image & Camera
  image_picker: ^1.0.4
  
  # Notifications
  flutter_local_notifications: ^19.4.1
  
  # Network
  connectivity_plus: ^6.1.5
  camera: ^0.11.2
  google_places_autocomplete_text_field: ^1.1.0
  geocoding: ^2.1.0
  geolocator: ^10.0.1
  file_picker: ^10.3.2
  # Fonts
  google_fonts: ^6.1.0
  change_app_package_name: ^1.5.0
  share_plus: ^7.2.2
  pdf: ^3.10.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  retrofit_generator: ^9.2.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/
    
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800